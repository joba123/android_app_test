name: Level Imp (Flutter)

on:
  push:
    paths:
      - 'level_imp/**'
      - '.github/workflows/level-imp.yml'
  pull_request:
    paths:
      - 'level_imp/**'
      - '.github/workflows/level-imp.yml'
  workflow_dispatch:

jobs:
  check:
    name: Analyze, test and (manually) build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: level_imp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (includes a bot that solves every level)
        run: flutter test

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch'
        run: flutter build apk --release

      - name: Upload APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: level-imp-apk
          path: level_imp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
